<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Home Page</title>

    <!-- Lazy Loading Bootstrap CSS to Reduce Unused Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" media="print" onload="this.onload=null;this.removeAttribute('media');">
    
    <!-- Non-Critical Stylesheet Loaded Asynchronously -->
    <link rel="stylesheet" href="styles.css" media="print" onload="this.onload=null;this.removeAttribute('media');">

    <!-- Inline Critical CSS for Above-the-Fold Content -->
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        /* Prevent Layout Shifts */
        .hero-section { padding: 50px; background: #007bff; color: white; text-align: center; min-height: 300px; display: flex; flex-direction: column; justify-content: center; }
        img, iframe { max-width: 100%; height: auto; display: block; }

        /* Ensure GPU Compositing for Smooth Animations */
        .fade-in { opacity: 0; transform: translateY(10px); transition: opacity 0.4s ease, transform 0.4s ease; will-change: opacity, transform; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">VESIT</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="#courses">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section">
        <h1>Welcome to VESIT</h1>
        <p>Empowering Future Leaders</p>
        <a href="#courses" class="btn btn-light mt-3">Explore Courses</a>
    </div>

    <!-- About Section -->
    <section id="about" class="py-5 fade-in">
        <div class="container">
            <h2 class="text-center">About Us</h2>
            <p class="text-center mb-5">Our institution has been a leader in education for over 50 years.</p>
        </div>
    </section>

    <!-- Courses Section -->
    <section id="courses" class="py-5 bg-light fade-in">
        <div class="container">
            <h2 class="text-center mb-5">Our Courses</h2>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="py-5 fade-in">
        <div class="container">
            <h2 class="text-center mb-5">Contact Us</h2>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2024 College Name. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JavaScript Deferred -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" defer></script>

    <!-- Lazy Load Animations -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const fadeIns = document.querySelectorAll(".fade-in");
            fadeIns.forEach(el => el.classList.add("visible"));
        });
    </script>
</body>
</html>
